<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaelumSMP — Coming soon</title>
  <meta name="description" content="CaelumSMP, a Minecraft survival server. The website goes live soon.">
  <!-- Link preview (Discord, X, etc.). Discord uses theme-color for the embed's side bar. Update the date if LAUNCH changes. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CaelumSMP">
  <meta property="og:url" content="https://caelumsmp.com/">
  <meta property="og:title" content="CaelumSMP — Launching 25 September">
  <meta property="og:description" content="A Minecraft survival SMP. The website goes live Friday 25 September 2026 at 18:00 UTC. Join the Discord at discord.gg/caelumsmp and get the launch email with the server IP.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#c6ff3d">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage" id="stage">
    <!-- floaters are added by the script below -->
    <a class="discord-top" href="https://discord.gg/caelumsmp" target="_blank" rel="noopener">
      <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#04131c" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.042-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.007.128 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></span>
      <span><b>Join Discord</b><small id="members" hidden></small></span>
    </a>
    <main>
      <p class="brand"><svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 96,27 50,50 4,27" fill="#c6ff3d"/><polygon points="4,27 50,50 50,97 4,74" fill="#8fc41f"/><polygon points="50,50 96,27 96,74 50,97" fill="#6a9612"/></svg>CaelumSMP</p>
      <h1>The website<br><em>goes live in</em></h1>
      <div class="cells" id="cells" role="timer" aria-label="Countdown to launch"></div>
      <p class="date" id="date"></p>
      <p class="local" id="local" hidden></p>
      <p class="live" id="live" hidden>We're live. Refresh the page to jump in.</p>


      <section class="news" id="news" aria-labelledby="news-title" hidden>
        <div class="text">
          <h2 id="news-title">Get the launch email</h2>
          <p>One email when the server opens, with the IP. No spam.</p>
        </div>
        <form id="news-form" novalidate>
          <label class="sr-only" for="news-email">Email address</label>
          <input id="news-email" name="email_address" type="email" autocomplete="email" placeholder="you@example.com" required>
          <button class="btn" type="submit">Notify me</button>
        </form>
        <p class="note" id="news-note" role="status">You'll get one email to confirm. Unsubscribe anytime.</p>
      </section>
    </main>
  </div>

  <script>
    // Launch moment (UTC). Change this one value to move the countdown.
    const LAUNCH = "2026-09-25T18:00:00Z";
    // Kit form ID (Kit → Grow → Landing Pages & Forms → your form; the number in its URL). Empty hides the sign-up card.
    const KIT_FORM_ID = "9936351";

    const target = Date.parse(LAUNCH);
    const stage = document.getElementById("stage");
    const cells = document.getElementById("cells");

    // Floating blocks: position, size, cursor depth and top/left/right face colors.
    const floaters = [
      ["12%", "6%", 96, 40, "#c6ff3d", "#8fc41f", "#6a9612"],
      ["70%", "3%", 60, -26, "#ff5a5f", "#c93b40", "#9c2b30"],
      ["8%", "84%", 70, -34, "#4de3ff", "#22a9c9", "#167f99"],
      ["66%", "88%", 110, 48, "#a77bff", "#7448d6", "#5631ab"],
      ["40%", "93%", 38, 20, "#ffffff", "#c9cfe6", "#9aa2c4"],
      ["86%", "44%", 44, -18, "#7bd35a", "#8b5a2b", "#6b4423"],
    ];
    floaters.forEach(([top, left, size, d, t, l, r], n) => {
      stage.insertAdjacentHTML("afterbegin",
        `<svg class="floater" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" style="top:${top};left:${left};--d:${d};animation-delay:${n * -1.1}s">` +
        `<polygon points="50,4 96,27 50,50 4,27" fill="${t}"/><polygon points="4,27 50,50 50,97 4,74" fill="${l}"/><polygon points="50,50 96,27 96,74 50,97" fill="${r}"/></svg>`);
    });

    // Cursor parallax: pointer position as --mx / --my in -1..1.
    stage.addEventListener("pointermove", (e) => {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      stage.style.setProperty("--mx", ((e.clientX / innerWidth) * 2 - 1).toFixed(3));
      stage.style.setProperty("--my", ((e.clientY / innerHeight) * 2 - 1).toFixed(3));
    });

    const units = [
      ["Days", 86400, "var(--lime)"],
      ["Hours", 3600, "var(--coral)"],
      ["Minutes", 60, "var(--cyan)"],
      ["Seconds", 1, "var(--violet)"],
    ];
    cells.innerHTML = units.map(([label, , c]) =>
      `<div class="cell" style="--c:${c}" aria-hidden="true"><span class="digits"></span><span class="unit">${label}</span></div>`).join("");
    const digitEls = [...cells.querySelectorAll(".digits")];

    const when = new Date(target);
    document.getElementById("date").innerHTML =
      `<time datetime="${LAUNCH}">${when.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" })} · ` +
      `${when.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "UTC" })} UTC</time>`;
    const local = document.getElementById("local");
    local.textContent = `That's ${when.toLocaleString(undefined, { weekday: "long", hour: "2-digit", minute: "2-digit", timeZoneName: "short" })} where you are.`;

    function tick() {
      const left = Math.max(0, Math.floor(target / 1000) - Math.floor(Date.now() / 1000));
      units.forEach(([, secs], i) => {
        const value = String(Math.floor((left % (i ? units[i - 1][1] : Infinity)) / secs)).padStart(2, "0");
        const el = digitEls[i];
        // only replace digits that changed, so each one replays its drop-in
        [...value].forEach((d, n) => {
          let b = el.children[n];
          if (b && b.textContent === d) return;
          const fresh = document.createElement("b");
          fresh.textContent = d;
          b ? b.replaceWith(fresh) : el.append(fresh);
        });
        while (el.children.length > value.length) el.lastChild.remove();
      });
      const d = Math.floor(left / 86400), h = Math.floor((left % 86400) / 3600), m = Math.floor((left % 3600) / 60);
      cells.setAttribute("aria-label", `${d} days, ${h} hours and ${m} minutes until launch`);
      local.hidden = left === 0;
      document.getElementById("live").hidden = left !== 0;
    }
    tick();
    setInterval(tick, 1000);

    // Live member count from Discord's public invite endpoint; the card works fine without it.
    fetch("https://discord.com/api/v10/invites/caelumsmp?with_counts=true")
      .then((r) => r.json())
      .then(({ approximate_member_count: members, approximate_presence_count: online }) => {
        if (!members) return;
        const el = document.getElementById("members");
        el.textContent = `${members} members · ${online} online`;
        el.hidden = false;
      })
      .catch(() => {});

    // Newsletter: our own form, posted straight to the Kit form's public subscribe endpoint (no API key in the page).
    if (KIT_FORM_ID) {
      const form = document.getElementById("news-form");
      const note = document.getElementById("news-note");
      const say = (text, cls) => { note.textContent = text; note.className = `note ${cls}`; };
      document.getElementById("news").hidden = false;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!form.email_address.checkValidity()) return say("That email doesn't look right.", "err");
        const btn = form.querySelector("button");
        btn.disabled = true;
        try {
          const r = await fetch(`https://app.kit.com/forms/${KIT_FORM_ID}/subscriptions`, {
            method: "POST", body: new FormData(form), headers: { Accept: "application/json" },
          });
          const data = await r.json().catch(() => ({}));
          if (data.status === "failed") return say(data.errors?.messages?.[0] || "That email didn't work. Check it and try again.", "err");
          if (!r.ok) throw new Error();
          form.reset();
          say("Almost done: check your inbox and confirm your email.", "ok");
        } catch {
          say("Couldn't sign you up right now. Try again, or join the Discord.", "err");
        } finally {
          btn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
